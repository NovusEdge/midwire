[project]
name = "midwire"
version = "0.1.0"
description = "Closed-loop agency: verify an agent's actions actually happened"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.0.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midwire"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
